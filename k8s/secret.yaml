# This file is a template for creating Kubernetes secrets.
# DO NOT commit actual secret values to version control.

# Option 1: Create secrets using kubectl create secret generic
# Replace <YOUR_VALUE> with your actual secret values.

# For JWT_SECRET
# kubectl create secret generic api-secret --from-literal=JWT_SECRET=<YOUR_JWT_SECRET>

# For PostgreSQL credentials
# kubectl create secret generic api-secret --from-literal=DB_USERNAME=<YOUR_DB_USERNAME> --from-literal=DB_PASSWORD=<YOUR_DB_PASSWORD> --from-literal=DB_DATABASE=<YOUR_DB_DATABASE>

# Option 2: Apply a YAML manifest (ensure values are base64 encoded)
# Example:
# apiVersion: v1
# kind: Secret
# metadata:
#   name: api-secret
# type: Opaque
# data:
#   JWT_SECRET: <BASE64_ENCODED_JWT_SECRET>
#   DB_USERNAME: <BASE64_ENCODED_DB_USERNAME>
#   DB_PASSWORD: <BASE64_ENCODED_DB_PASSWORD>
#   DB_DATABASE: <BASE64_ENCODED_DB_DATABASE>

# To base64 encode a value: echo -n "your_value" | base64