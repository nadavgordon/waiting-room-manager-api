mdml_version: "Agenda-1.4"
document_type: AgendaInstance

agenda_metadata:
  name: "Waiting Room Manager API - Development Agenda"
  version: "1.0"
  goal: "To build a RESTful API for managing multiplayer game waiting rooms, including creation, joining, and game start functionalities, along with containerization for deployment."
  creation_date: "2025-05-27"
  last_updated_date: "2025-05-28"
  authors:
    - name: "AI Assistant Cascade"
      role: "MDML Author"
  status: "in-progress"
  scope_summary: "In scope: API development, Dockerization, basic K8s setup, documentation. Out of scope: Advanced K8s features beyond provided YAMLs, extensive UI development, production-grade load testing."
  target_audience: "Backend Engineer, DevOps Engineer, Project Stakeholders"
  estimated_duration: "1-2 days (as per original task estimation)"
  related_documents:
    - doc_id: "WRM-API-REQ-MD"
      description: "Main requirements and overview markdown file."
      location: "plan/waiting-room-manager-api.md"
    - doc_id: "WRM-API-BLUEPRINT"
      description: "Waiting Room Manager API Blueprint."
      location: "plan/waiting-room-manager-api-blueprint.mdml.yml"
    - doc_id: "WRM-API-IMPROVEMENTS-AGENDA"
      description: "Waiting Room Manager API Improvement Agenda."
      location: "plan/waiting-room-manager-api-improvements-agenda.mdml.yml"

executor_persona:
  role: "Backend Software Developer & DevOps Engineer"
  expertise_level: "Mid-level to Senior, proficient in chosen backend stack (Node.js or PHP/Laravel) and Docker."
  responsibilities:
    - "Implement API endpoints as specified."
    - "Ensure code quality, security, and maintainability."
    - "Create Dockerfile and necessary configurations for containerization."
    - "(Bonus) Prepare Kubernetes deployment YAMLs."
    - "Document the API and setup procedures."
  communication_style: "Clear, concise, with proactive updates on progress and potential issues."
  tools_and_technologies:
    - "Node.js (NestJS/AdonisJS/Express+TS) OR PHP (Laravel)"
    - "Chosen ORM (e.g., TypeORM, Sequelize, Eloquent)"
    - "SQLite, MySQL, or PostgreSQL"
    - "Docker"
    - "Git"
    - "(Bonus) Kubernetes, Helm"
    - "(Bonus) OpenAPI/Swagger tools or Postman"

task_context:
  project_background: "The project is to build a RESTful API for managing multiplayer game waiting rooms. This API is a core component for a gaming platform, allowing users to create, join, and manage game sessions before they start. The task serves as an evaluation of backend development, containerization, and deployment skills."
  problem_statement: "Game developers require a standardized and robust system to manage pre-game lobbies or waiting rooms, handling aspects like room visibility, player limits, join requests, and game initiation."
  user_stories_or_scenarios:
    - story_id: "US-001"
      as_a: "Game Host"
      i_want_to: "create a new game room with specific settings (title, public/private, player limits, join approval, start mode)"
      so_that: "I can set up a waiting area for my game tailored to my preferences."
    - story_id: "US-002"
      as_a: "Player"
      i_want_to: "see a list of public game rooms"
      so_that: "I can find and choose a game to join."
    - story_id: "US-003"
      as_a: "Player"
      i_want_to: "request to join a specific room"
      so_that: "I can participate in the game when it starts."
    - story_id: "US-004"
      as_a: "Game Host"
      i_want_to: "approve or decline join requests for my private room if approval is required"
      so_that: "I can control who joins my game."
    - story_id: "US-005"
      as_a: "Player or Host"
      i_want_to: "leave a room I am currently in"
      so_that: "I am no longer part of that waiting room."
    - story_id: "US-006"
      as_a: "Game Host"
      i_want_to: "start the game when all conditions are met (e.g., min players, manual trigger)"
      so_that: "the game session can begin for all participants."
    - story_id: "US-007"
      as_a: "Game Host"
      i_want_to: "delete a room I created"
      so_that: "the room is no longer available."
  business_value_or_impact: "Successful completion will demonstrate proficiency in backend API development, modern DevOps practices, and the ability to deliver a functional, well-documented application component. For a real-world scenario, this API would be crucial for player engagement and game session management."

task_definition:
  overall_task_description: "Develop, test, and document the Waiting Room Manager API as per the specified requirements. This includes implementing all defined API endpoints, ensuring code quality and security, and preparing the application for containerized deployment using Docker, with bonus considerations for Kubernetes."
  key_deliverables:
    - "Fully functional RESTful API implementing all specified features."
    - "Source code hosted in a Git repository."
    - "Multi-step Dockerfile and .dockerignore file."
    - "(Bonus) Kubernetes YAML files (deployment, service, configmap, secret)."
    - "Comprehensive README.md including API description, setup instructions (local & containerized), deployment steps, database migration instructions, and any assumptions."
    - "(Bonus) OpenAPI/Swagger specification or Postman collection."
    - "(Bonus) Basic test coverage."
  instructions:
    preliminary_steps:
      - "Choose technology stack (PHP/Laravel or Node.js variant)."
      - "Set up local development environment for the chosen stack."
      - "Initialize Git repository."
    core_steps:
      - step_id: "API-IMPL-01"
        description: "Implement Room Creation (`POST /api/rooms`)."
        deliverables_impacted: ["SOURCE_CODE"]
        status: "completed"
        completion_date: "2025-05-27"
        notes: "Basic room creation implemented, but missing some configurations (visibility, approval settings, etc.)"
        sub_steps:
          - "Define room model/entity (Title, IsPublic, ApprovalRequired, Min/Max Players, AutoStart, HostID, RoomIdentifier)."
          - "Implement logic for generating random, hard-to-guess room identifier."
          - "Handle request validation and persistence."
          - "Implement simulated or basic authentication to assign host."
      - step_id: "API-IMPL-02"
        description: "Implement List Waiting Rooms (`GET /api/rooms`)."
        deliverables_impacted: ["SOURCE_CODE"]
        status: "completed"
        completion_date: "2025-05-28"
        notes: "Filtering for public rooms, and private rooms where user is host, is implemented. Anonymous access shows only public rooms."
        priority: "high"
        sub_steps:
          - "Filter public rooms and private rooms where user is host/player."
      - step_id: "API-IMPL-03"
        description: "Implement Join Room (`POST /api/rooms/{room}/join`)."
        deliverables_impacted: ["SOURCE_CODE"]
        status: "completed"
        completion_date: "2025-05-28"
        notes: "Implemented joining a room with checks for host, room capacity, and existing players. Approval logic deferred to API-IMPL-04."
        priority: "high"
        sub_steps:
          - "Handle player joining logic, considering room capacity and approval requirements."
      - step_id: "API-IMPL-04"
        description: "Implement Join Request Approval (`POST /api/rooms/{room}/pending-requests/{request}/respond`)."
        deliverables_impacted: ["SOURCE_CODE"]
        status: "completed"
        completion_date: "2025-05-28"
        notes: "Implemented approval/decline logic for join requests in private, approval-required rooms. Host can manage pending requests. Tested various scenarios including room full and unauthorized attempts. Temporarily added hostUserId to DTO for testing."
        priority: "high"
        sub_steps:
          - "Allow host to approve/decline pending join requests."
      - step_id: "API-IMPL-05"
        description: "Implement Leave Room (`POST /api/rooms/{room}/leave`)."
        deliverables_impacted: ["SOURCE_CODE"]
        status: "completed"
        completion_date: "2025-05-28"
        notes: "Implemented endpoint for players to leave a room or cancel a pending join request. Host cannot use this endpoint. Tested scenarios: pending player leaves, active player leaves, non-associated player attempts to leave, host attempts to leave."
        priority: "high"
        sub_steps:
          - "Allow players to leave the room or cancel their pending join request."
      - step_id: "API-IMPL-06"
        description: "Implement Start Game (`POST /api/rooms/{id}/start`)."
        deliverables_impacted: ["SOURCE_CODE"]
        status: "completed"
        completion_date: "2025-05-28"
        notes: "Implemented endpoint for host to start the game. Changes room status to 'in-progress', clears pending requests. Requires at least one player. Tested: successful start, starting an already started game, non-host start, starting with no players."
        priority: "high"
        sub_steps:
          - "Allow host to start the game, changing room status."
      - step_id: "API-IMPL-07"
        description: "Implement Delete Room (`DELETE /api/rooms/{room})."
        deliverables_impacted: ["SOURCE_CODE"]
        status: "completed"
        completion_date: "2025-05-28"
        notes: "Implemented endpoint for host to delete their room. Requires hostId for authorization. Tested: successful delete, non-host delete attempt, deleting non-existent room."
        priority: "medium"
        sub_steps:
          - "Allow host to delete the room."
      - step_id: "API-SEC-01"
        description: "Implement Security Measures."
        deliverables_impacted: ["SOURCE_CODE"]
        status: "pending"
        priority: "high"
        sub_steps:
          - "Ensure protection against SQL Injection."
          - "Implement fine-grained CORS management (no '*')."
          - "Ensure no secrets are included in the codebase/repository."
          - "(Bonus) Implement trusted proxy mechanism for user IP."
      - step_id: "DEVOPS-DOCKER-01"
        description: "Prepare Docker setup."
        deliverables_impacted: ["DOCKERFILE", "SOURCE_CODE"]
        status: "pending"
        priority: "high"
        sub_steps:
          - "Define a multi-step Dockerfile."
          - "Configure .dockerignore."
          - "Use environment variables for configuration."
          - "Ensure application does not run as root in the container."
      - step_id: "DEVOPS-K8S-01"
        description: "(Bonus) Prepare Kubernetes YAMLs."
        deliverables_impacted: ["K8S-YAMLS", "README"]
        status: "pending"
        priority: "medium"
        sub_steps:
          - "Create deployment.yaml, service.yaml, configmap.yaml, secret.yaml."
      - step_id: "DOC-01"
        description: "Create README documentation."
        deliverables_impacted: ["README"]
        status: "partially-completed"
        notes: "README exists but needs comprehensive updates for API documentation, setup instructions, and deployment steps"
        priority: "medium"
    post_completion_steps:
      - "Review all deliverables against the submission checklist."
      - "Ensure repository is public or shareable as instructed."
  constraints_and_assumptions:
    constraints:
      - "Must use one of the specified technology stacks (PHP/Laravel or Node.js variant)."
      - "ORM must be used for database interaction (SQLite, MySQL, or PostgreSQL)."
      - "Authentication can be simulated or basic."
      - "Codebase must be organized and well-structured."
      - "No wildcard CORS allowed."
      - "No secrets in the repository."
    assumptions:
      - "The executor has access to development tools for the chosen stack."
      - "Basic understanding of REST API principles is present."
      - "Familiarity with Docker fundamentals."
  success_metrics_or_evaluation_criteria:
    - "All API endpoints function as described."
    - "Code is clean, readable, maintainable, and follows best practices for the chosen stack."
    - "Application is successfully containerized with Docker and runs as expected."
    - "(Bonus) Kubernetes deployment functions correctly."
    - "Security requirements (SQLi, CORS, no secrets) are met."
    - "README provides clear and complete instructions."
    - "All items in submission checklist are addressed."
  acceptance_criteria:
    - "API allows creation of rooms with specified configurations."
    - "Public rooms are listable; private rooms are listable under correct conditions."
    - "Users can join and leave rooms; join requests can be managed."
    - "Games can be started by hosts and rooms can be deleted."
    - "Docker image builds and runs the application successfully."

