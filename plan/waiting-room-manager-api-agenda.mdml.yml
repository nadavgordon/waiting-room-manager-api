    definition: "Waiting Room Manager API, the subject of this development task."
  - term: "CORS"
    definition: "Cross-Origin Resource Sharing, a security mechanism for web applications."

few_shot_examples:
  - example_id: "FS-CORS-CONFIG"
    description: "Example of a non-wildcard CORS configuration for Express.js."
    input:
      scenario: "Setting up CORS for allowed origins example.com and api.example.com"
    expected_output:
      code_snippet: |
        const cors = require('cors');
        const allowedOrigins = ['http://example.com', 'https://api.example.com'];
        const corsOptions = {
          origin: function (origin, callback) {
            if (allowedOrigins.indexOf(origin) !== -1 || !origin) {
              callback(null, true);
            } else {
              callback(new Error('Not allowed by CORS'));
            }
          }
        };
        // app.use(cors(corsOptions)); // Example usage
