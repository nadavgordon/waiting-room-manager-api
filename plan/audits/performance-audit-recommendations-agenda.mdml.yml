glossary_and_definitions:
  - term: "N+1 Problem"
    definition: "A database query anti-pattern where an application makes N additional queries to the database for each result of an initial query, leading to performance degradation."
  - term: "HPA"
    definition: "Horizontal Pod Autoscaler - a Kubernetes feature that automatically scales the number of pods in a deployment based on observed CPU utilization or other select metrics."
  - term: "TTL"
    definition: "Time To Live - a mechanism that limits the lifespan or validity of data in a computer or computer network."
  - term: "Atomicity (Database)"
    definition: "A property of database transactions that guarantees that all operations within the transaction are completed successfully; otherwise, the transaction is aborted, and the database is left unchanged."