  expected_outputs:
    - output_id: "ARCH-IMPR-CODE"
      description: "Source code with implemented architectural improvements."
      format_or_type: "Git Repository (feature branch)"
      delivery_method: "Push to remote repository for pull request."
    - output_id: "DB-MIGRATION"
      description: "New TypeORM migration script for User entity changes."
      format_or_type: "TypeScript file"
      delivery_method: "Included in source code."
    - output_id: "UPDATED-DOCS"
      description: "Updated Swagger API documentation and relevant code comments."
      format_or_type: "Generated HTML/JSON (Swagger), In-code comments"
      delivery_method: "Accessible via API endpoint, part of source code."
    - output_id: "TEST-RESULTS"
      description: "Results of unit, integration, and E2E tests."
      format_or_type: "Test reports/logs"
      delivery_method: "Via CI/CD pipeline or local execution."
  quality_standards_for_output:
    - "Code adheres to NestJS best practices and project coding standards."
    - "All new/modified code is covered by automated tests."
    - "Performance of critical paths is not degraded."
    - "Security vulnerabilities are not introduced."

glossary_and_definitions:
  - term: "MDML Agenda"
    definition: "Markdown Machine Language Agenda - a structured YAML document defining tasks, goals, and execution plans for AI agents."
  - term: "Race Condition"
    definition: "A situation where multiple operations access and manipulate the same shared resource concurrently, and the outcome depends on the order of execution, potentially leading to incorrect results."
  - term: "Distributed Tracing"
    definition: "A method used to monitor requests as they flow through a distributed system, providing insights into latency, errors, and performance across different services."
  - term: "Refresh Token"
    definition: "A long-lived credential used to obtain new access tokens after the short-lived access token expires, improving security by limiting the exposure of access tokens."