glossary_and_definitions:
  - term: "Health Check"
    definition: "An endpoint or mechanism used by orchestrators (like Kubernetes) to determine if an application instance is running and ready to receive traffic."
  - term: "Liveness Probe"
    definition: "A Kubernetes probe that checks if a container is still running. If it fails, Kubernetes restarts the container."
  - term: "Readiness Probe"
    definition: "A Kubernetes probe that checks if a container is ready to serve requests. If it fails, Kubernetes removes the pod from service load balancers."
  - term: "Correlation ID"
    definition: "A unique identifier added to all log messages and requests within a single transaction, used for tracing the flow of a request through distributed systems."
  - term: "NetworkPolicy"
    definition: "A Kubernetes resource that allows you to specify how groups of pods are allowed to communicate with each other and with external network endpoints."
  - term: "Pod Security Context"
    definition: "A Kubernetes feature that defines privilege and access control settings for a Pod or Container, enhancing security."
  - term: "Graceful Shutdown"
    definition: "The process of allowing an application to finish processing current requests and clean up resources before terminating, preventing data loss or errors during restarts/deployments."
  - term: "StatefulSet"
    definition: "A Kubernetes workload API object used to manage stateful applications, providing stable, unique network identifiers and persistent storage."
  - term: "Pod Anti-Affinity"
    definition: "A Kubernetes scheduling rule that prevents pods from being scheduled on the same node, improving high availability."
  - term: "Horizontal Pod Autoscaler (HPA)"
    definition: "A Kubernetes API object that automatically scales the number of pod replicas based on observed CPU utilization or other select metrics."
  - term: "Circuit Breaker"
    definition: "A design pattern used in distributed systems to prevent a cascading failure when a service calls another service that is failing or unresponsive."
  - term: "Point-in-Time Recovery (PITR)"
    definition: "A database recovery technique that allows restoring a database to any specific point in time, typically used for disaster recovery."