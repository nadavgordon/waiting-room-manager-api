agenda_metadata:
  name: "Waiting Room Manager API - Operational Readiness Improvement Agenda"
  version: "1.0"
  goal: "To enhance the operational readiness of the Waiting Room Manager API based on a comprehensive audit, addressing critical deficiencies for production deployment."
  creation_date: "2025-05-30"
  last_updated_date: "2025-05-30"
  authors:
    - name: "Roo (AI Technical Leader)"
      role: "Architect / Planner"
  status: "draft"
  scope_summary: "This agenda outlines critical improvements for health checks, logging, security, resource management, graceful shutdown, and dependency management to achieve production-grade operational readiness for the Waiting Room Manager API."
  target_audience: "Backend Developers, DevOps Engineers"
  estimated_duration: "To be determined (requires further estimation per task)"
  related_documents:
    - doc_id: "WRM-PROD-READINESS-AGENDA"
      description: "Previous Production Readiness & Phased Deployment Plan"
      location: "plan/production-readiness-agenda.mdml.yml"
    - doc_id: "WRM-BLUEPRINT"
      description: "Waiting Room Manager API Blueprint"
      location: "plan/waiting-room-manager-api-blueprint.mdml.yml"

executor_persona:
  role: "Senior Backend Developer & DevOps Engineer"
  expertise_level: "Proficient in NestJS, TypeORM, PostgreSQL, Docker, Kubernetes, and operational best practices."
  responsibilities:
    - "Implement API enhancements, containerization, and deployment improvements as outlined."
    - "Ensure all changes are thoroughly tested and documented."
    - "Proactively identify and address potential operational issues."
  communication_style: "Clear, concise, with proactive updates on progress, challenges, and potential issues."
  tools_and_technologies:
    - "NestJS, TypeORM, PostgreSQL, Redis"
    - "Docker, Docker Compose, Kind, kubectl"
    - "Kubernetes (for manifest creation and cloud deployment planning)"
    - "Winston, Jest, Git"

task_context:
  project_background: "The Waiting Room Manager API has undergone initial containerization and Kubernetes manifest creation. A comprehensive operational readiness audit has identified several areas requiring improvement to meet production standards."
  problem_statement: "The current operational setup has critical deficiencies in health checks, logging, security, resource management, high availability, graceful shutdown, and disaster recovery, preventing it from being truly production-ready and resilient."
  user_stories_or_scenarios:
    - story_id: "OPS-HEALTH-001"
      as_a: "DevOps Engineer"
      i_want_to: "have reliable health checks for API pods"
      so_that: "Kubernetes accurately manages pod lifecycle and traffic routing."
    - story_id: "DEV-LOGGING-001"
      as_a: "Developer"
      i_want_to: "access consistent and traceable logs"
      so_that: "I can efficiently debug issues in production and staging environments."
    - story_id: "OPS-DEPLOY-001"
      as_a: "Operator"
      i_want_to: "deploy application updates seamlessly"
      so_that: "users experience minimal downtime and data integrity is maintained."
  business_value_or_impact: "Implementing this agenda will result in a more stable, resilient, and secure API, reducing operational overhead, improving debuggability, and preparing the application for scalable production deployment with higher confidence."

task_definition:
  overall_task_description: "Systematically address the identified operational readiness gaps in the Waiting Room Manager API, focusing on enhancing health checks, refining logging, strengthening security, optimizing resource management, implementing graceful shutdown, and improving dependency management."
  key_deliverables:
    - "Enhanced and robust health check endpoints."
    - "Refactored logging for consistency, traceability, and external integration readiness."
    - "Improved Kubernetes security configurations (NetworkPolicy, Pod Security Contexts)."
    - "Optimized Kubernetes resource management and high availability configurations."
    - "Implemented graceful shutdown mechanisms for the API."
    - "Cleaned up `package.json` and `Dockerfile` for better maintainability and efficiency."
    - "Updated documentation for all operational aspects and new configurations."
  instructions:
    core_steps:
      - step_id: "HEALTH-CHECKS-ENHANCE"
        description: "Enhance Health Check Endpoints"
        sub_steps:
          - "Modify `/health/ready` to verify database connectivity (e.g., simple query)."
          - "Modify `/health/ready` to verify Redis connectivity (e.g., PING command)."
          - "Ensure `/health/live` checks basic application functionality beyond just 'OK'."
          - "Add `HEALTHCHECK` instruction to Dockerfile."
      - step_id: "LOGGING-REFINEMENT"
        description: "Refine Logging Implementation"
        sub_steps:
          - "Refactor `AllExceptionsFilter` to inject and use the shared `LoggerService`."
          - "Implement request correlation IDs to trace requests across logs."
          - "Consider adding external logging transport (e.g., file, remote service) for production."
      - step_id: "CONFIG-VALIDATION"
        description: "Implement Comprehensive Configuration Validation"
        sub_steps:
          - "Create a centralized validation mechanism for all critical environment variables at application bootstrap."
          - "Clarify Kubernetes secret key naming and mapping to avoid confusion (e.g., ensure `api-secret` keys match application's expected env var names)."
      - step_id: "RESOURCE-HA-OPTIMIZE"
        description: "Optimize Resource Management and High Availability in Kubernetes"
        sub_steps:
          - "Review and adjust Kubernetes resource requests/limits based on expected production load."
          - "Increase replica counts for `api-deployment` and `redis-deployment` to ensure high availability."
          - "Implement Pod Anti-Affinity rules for critical components (API, Postgres, Redis) to spread across nodes."
          - "Consider Horizontal Pod Autoscalers (HPAs) for the API."
          - "Migrate `redis-deployment` to a `StatefulSet` with persistent volume claim for data durability."
      - step_id: "DOCKERFILE-OPTIMIZE"
        description: "Optimize Dockerfile and Build Process"
        sub_steps:
          - "Pin base Node.js image to a specific patch version (e.g., `node:22.2.0-alpine`)."
          - "Change `npm install` to `npm ci` in the Dockerfile for deterministic builds."
          - "Remove the unnecessary `./db` directory creation and permission setting from Dockerfile."
      - step_id: "DEPENDENCY-CLEANUP"
        description: "Clean Up Dependencies and Package Configuration"
        sub_steps:
          - "Remove `sqlite3` dependency from `package.json` if not actively used."
          - "Fix duplicate `dependencies` and `devDependencies` sections in `package.json`."
      - step_id: "GRACEFUL-SHUTDOWN"
        description: "Implement Graceful Shutdown"
        sub_steps:
          - "Enable NestJS `enableShutdownHooks()` in `src/main.ts`."
          - "Ensure proper cleanup of database and Redis connections upon application shutdown."
          - "Implement connection draining for in-flight requests."
      - step_id: "K8S-NETWORK-SECURITY"
        description: "Enhance Kubernetes Network Security"
        sub_steps:
          - "Define and apply `NetworkPolicy` resources to restrict inter-pod communication."
          - "Configure appropriate Pod Security Contexts for containers."
      - step_id: "DB-OPERATIONS-IMPROVE"
        description: "Improve Database Operational Aspects"
        sub_steps:
          - "Implement database connection pooling configuration."
          - "Add retry mechanisms for database connection failures."
          - "Consider implementing a migration locking mechanism for concurrent deployments."
      - step_id: "OBSERVABILITY-ENHANCE"
        description: "Enhance Observability"
        sub_steps:
          - "Add a Prometheus metrics endpoint to the API."
          - "Implement basic distributed tracing (e.g., OpenTelemetry integration)."
      - step_id: "DR-PLANNING"
        description: "Outline Disaster Recovery Strategy"
        sub_steps:
          - "Document a database backup strategy (e.g., scheduled backups, point-in-time recovery)."
          - "Define data retention policies."
          - "Outline a high-level disaster recovery testing procedure."
  constraints_and_assumptions:
    constraints:
      - "Must continue to use NestJS, TypeORM, PostgreSQL, Redis, Docker, and Kubernetes."
      - "Changes must maintain backward compatibility where possible."
    assumptions:
      - "Existing infrastructure (Kubernetes cluster, Docker registry) is available and configurable for deployment."
      - "Team has necessary permissions to implement Kubernetes configurations."
  success_metrics_or_evaluation_criteria:
    - "Health checks accurately reflect the true health and readiness of the application and its dependencies."
    - "Application logs are consistent, structured, traceable, and easily consumable by log aggregation systems."
    - "Kubernetes deployments demonstrate high availability and resilience during simulated failures."
    - "Application shuts down gracefully without data loss or abrupt connection termination."
    - "No unnecessary dependencies or configuration ambiguities remain in the codebase."
    - "Security posture is improved through network policies and container hardening."
  acceptance_criteria:
    - "All core steps are implemented, tested, and verified through appropriate means (e.g., manual testing, automated tests, Kubernetes events)."
    - "Updated configurations and code adhere to established best practices and project standards."
    - "Documentation (README.md, new operational guides) is comprehensive, accurate, and actionable for developers and operations teams."

