glossary_and_definitions:
  - term: "Atomicity"
    definition: "A property of database transactions that ensures all operations within a transaction are completed successfully, or none of them are. It's an 'all or nothing' principle."
  - term: "Graceful Shutdown"
    definition: "The process by which an application or service terminates cleanly, releasing resources, completing in-flight requests, and preventing data loss or corruption."
  - term: "Readiness Probe"
    definition: "A Kubernetes probe that determines if a container is ready to serve requests. If it fails, Kubernetes removes the pod from service load balancers."
  - term: "Liveness Probe"
    definition: "A Kubernetes probe that determines if a container is running. If it fails, Kubernetes restarts the container."
  - term: "Connection Pooling"
    definition: "A technique used to manage and reuse database connections, reducing the overhead of opening and closing connections for each request."
  - term: "Rate Limiting"
    definition: "A control that limits the number of requests a user or client can make to an API within a given timeframe, preventing abuse and DoS attacks."
  - term: "Optimistic Locking"
    definition: "A concurrency control method used to prevent conflicts when multiple users try to update the same record simultaneously, typically by checking a version number or timestamp."