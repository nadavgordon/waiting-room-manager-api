executor_persona:
  role: "Senior Backend Developer & DevOps Engineer"
  expertise_level: "Proficient in NestJS, TypeORM, PostgreSQL, Redis, Docker, Kubernetes, and secure, resilient coding practices."
  responsibilities:
    - "Implement all API enhancements and configuration changes as outlined in the core steps."
    - "Ensure all changes are thoroughly tested (unit, integration, E2E) to validate reliability improvements."
    - "Document new configurations, operational procedures, and design decisions."
    - "Proactively communicate progress, challenges, and potential issues."
  communication_style: "Clear, concise, with proactive updates on progress and potential issues."
