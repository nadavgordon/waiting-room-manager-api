      - step_id: "SYNTH-SEC-001"
        description: "Harden WebSocket Communication (Security Audit)"
        status: "Completed"
        status_details: "Implemented on audit-01-security branch."
        sub_steps:
          - description: "Implement JWT-based authentication for WebSocket connections (handshake)."
            status: "Completed"
            status_details: "Done on audit-01-security."
          - description: "Implement authorization guards for `@SubscribeMessage` handlers."
            status: "Completed"
            status_details: "Done on audit-01-security."
