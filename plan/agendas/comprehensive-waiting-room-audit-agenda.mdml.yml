    - "Prometheus (for metrics)"

task_context:
  project_background: "The Waiting Room Manager API is a backend service for managing multiplayer game waiting rooms. Comprehensive audits across various aspects of the project have identified numerous areas for improvement to meet production-grade standards."
  problem_statement: "Multiple audits have revealed critical and high-priority issues spanning security vulnerabilities, reliability risks, performance bottlenecks, operational deficiencies, code quality concerns, inconsistent logging/monitoring, and incomplete/inaccurate documentation. These issues collectively hinder the API's readiness for robust, secure, and scalable production deployment and impact maintainability and developer experience. This synthesized agenda aims to address these issues holistically."
  user_stories_or_scenarios: # Synthesized from various audits
    - story_id: "SYNTH-USER-SECURE"
      as_a: "User"
      i_want_to: "trust that my data and interactions with the API are secure"
      so_that: "I can use the service without concerns about privacy or unauthorized access."
    - story_id: "SYNTH-USER-RELIABLE"
      as_a: "User"
      i_want_to: "experience a consistently available and correctly functioning waiting room service"
      so_that: "my pre-game experience is smooth and dependable."
    - story_id: "SYNTH-DEV-EFFICIENT"
      as_a: "Developer"
      i_want_to: "work with a well-structured, well-documented, and maintainable codebase"
      so_that: "I can efficiently debug issues, add new features, and onboard new team members."
    - story_id: "SYNTH-OPS-STABLE"
      as_a: "DevOps Engineer"
      i_want_to: "deploy, manage, and monitor a stable, resilient, and performant API in production"
      so_that: "operational overhead is minimized and service level objectives are met."
  business_value_or_impact: "Successfully completing this comprehensive agenda will significantly improve the API's security posture, reliability, performance, and maintainability. This leads to reduced operational risks and costs, enhanced user trust and satisfaction, faster and safer development cycles, and a solid foundation for future scalability and feature enhancements, aligning with the project's goal of a high-quality backend system."

task_definition:
  overall_task_description: "Execute a prioritized and consolidated set of tasks derived from comprehensive project audits. This involves implementing security hardening measures, enhancing system reliability and data integrity, optimizing performance, improving operational readiness and DevOps practices, refactoring code for quality, standardizing logging and monitoring, and conducting a thorough overhaul of all project documentation, with a special focus on creating a professional and comprehensive README.md."
  key_deliverables:
    - "A significantly more secure, reliable, and performant Waiting Room Manager API."
    - "Robust and consistent logging, monitoring, and health check mechanisms."
    - "Optimized Docker and Kubernetes configurations for production readiness."
    - "Improved codebase quality, maintainability, and test coverage."
    - "Comprehensive, accurate, and up-to-date project documentation, including a high-quality `README.md`."
    - "Resolved critical and high-priority issues from all conducted audits."
  instructions:
    preliminary_steps:
      - "Thoroughly review this synthesized agenda and all related audit documents and `plan/waiting-room-manager-api.md`."
      - "Establish a clear branching strategy in Git for implementing these changes."
      - "Ensure the local development environment is fully functional and all existing tests pass before starting."
      - "Prioritize tasks within each section based on security impact, ease of implementation, and dependency on other tasks."
    core_steps:
      # Section 1: Security Hardening (High Priority)
      - step_id: "SYNTH-SEC-001"
        description: "Harden WebSocket Communication (Security Audit)"
        sub_steps:
          - "Implement JWT-based authentication for WebSocket connections (handshake)."
          - "Implement authorization guards for `@SubscribeMessage` handlers."
          - "Validate input payloads for WebSocket messages (e.g., `roomId` as UUID)."
      - step_id: "SYNTH-SEC-002"
        description: "Implement Brute-Force Protection & Rate Limiting (Security, Reliability, Performance Audits)"
        sub_steps:
          - "Add rate limiting to `/auth/login` and `/auth/register` endpoints."
          - "Add rate limiting to critical API endpoints like `POST /rooms`, `POST /rooms/{roomId}/join`."
          - "Consider account lockout mechanisms after multiple failed login attempts."
      - step_id: "SYNTH-SEC-003"
        description: "Enhance JWT Management and Authentication (Security, Architecture Audits)"
        sub_steps:
          - "Implement a JWT refresh token mechanism."
          - "Develop a token revocation strategy (e.g., blacklist)."
          - "Remove redundant `?? ''` fallback for `JWT_SECRET` in [`src/auth/jwt.strategy.ts`](src/auth/jwt.strategy.ts:0)."
          - "Ensure `JWT_SECRET` is strong and properly managed via environment variables."
      - step_id: "SYNTH-SEC-004"
        description: "Improve Logging Security (Security Audit)"
        sub_steps:
          - "Mask or remove Personally Identifiable Information (PII) like usernames and user IDs from production logs."
          - "Implement log sanitization to prevent log injection attacks."
      - step_id: "SYNTH-SEC-005"
        description: "Secure Cache (Redis) Configuration (Security Audit)"
        sub_steps:
          - "Ensure Redis connection always requires a password in production; disallow connection without a password."
      - step_id: "SYNTH-SEC-006"
        description: "Add HTTP Security Headers (Security Audit)"
        sub_steps:
          - "Implement Content-Security-Policy (CSP)."
          - "Add X-Content-Type-Options, X-Frame-Options, and Strict-Transport-Security (HSTS) headers."
      - step_id: "SYNTH-SEC-007"
        description: "Review and Correct Dependencies (Security Audit)"
        sub_steps:
          - "Investigate and correct `bcrypt` version in `package.json`."
          - "Clean up `package.json`: remove duplicate `dependencies`/`devDependencies` sections (also from Ops audit)."

      # Section 2: Reliability and Data Integrity
      - step_id: "SYNTH-REL-001"
        description: "Implement Explicit Database Transactions (Reliability, Performance, Architecture Audits)"
        sub_steps:
          - "Refactor `createRoom` in [`src/waiting-room/waiting-room.service.ts`](src/waiting-room/waiting-room.service.ts:30) for atomic Room and RoomPlayer creation."
          - "Refactor `deleteRoom` in [`src/waiting-room/waiting-room.service.ts`](src/waiting-room/waiting-room.service.ts:129) for atomic RoomPlayers and Room deletion."
          - "Refactor `startGame` in [`src/waiting-room/waiting-room.service.ts`](src/waiting-room/waiting-room.service.ts:312) for atomic Room status update and pending player decline."
          - "Review and apply transactions to `joinRoom`, `approveOrDeclineJoinRequest`, `leaveRoom` in [`src/waiting-room/waiting-room.service.ts`](src/waiting-room/waiting-room.service.ts:158) to prevent race conditions."
      - step_id: "SYNTH-REL-002"
        description: "Enhance Database and Cache Connection Resilience (Reliability Audit)"
        sub_steps:
          - "Configure TypeORM DataSource ([`src/db/data-source.ts`](src/db/data-source.ts:0)) with connection pooling."
          - "Implement connection retry logic (e.g., exponential backoff) for PostgreSQL at startup."
          - "Configure Redis client ([`src/app.module.ts`](src/app.module.ts:40-51)) with retry strategy, timeouts, and reconnect logic."
      - step_id: "SYNTH-REL-003"
        description: "Strengthen Database-Level Constraints (Reliability Audit)"
        sub_steps:
          - "Add unique constraint on `roomId` and `userId` in `room_players` table."
          - "Add database-level check constraints for enum fields (e.g., `RoomStatus`, `RoomPlayerStatus`)."
          - "Add a minimum value constraint for `maxPlayers` in `rooms` table."
      - step_id: "SYNTH-REL-004"
        description: "Address User Deletion Data Integrity (Architecture Audit)"
        sub_steps:
          - "Define and implement a strategy for handling `RoomPlayer` and `Room` records when a `User` is deleted (e.g., soft delete, nullify FKs, explicit cleanup)."

      # Section 3: Performance Optimization
      - step_id: "SYNTH-PERF-001"
        description: "Implement Database Indexing (Performance Audit)"
        sub_steps:
          - "Add composite index on `roomId` and `status` in `RoomPlayer` entity ([`src/waiting-room/entities/room-player.entity.ts`](src/waiting-room/entities/room-player.entity.ts:0))."
          - "Add composite index on `userId` and `roomId` in `RoomPlayer` entity."
          - "Add index on `isPublic` in `Room` entity ([`src/waiting-room/entities/room.entity.ts`](src/waiting-room/entities/room.entity.ts:0))."
          - "Generate and apply TypeORM migration for new indexes."
      - step_id: "SYNTH-PERF-002"
        description: "Enhance Caching Strategy (Performance Audit)"
        sub_steps:
          - "Implement caching for `findAllRooms` results in [`src/waiting-room/waiting-room.service.ts`](src/waiting-room/waiting-room.service.ts:61) (use cache keys with pagination params)."
          - "Consider caching frequently accessed aggregate data (e.g., active player counts per room)."
          - "Review and adjust Redis TTL settings (default or per-key)."
      - step_id: "SYNTH-PERF-003"
        description: "Optimize WebSocket Communication (Performance, Code Quality Audits)"
        sub_steps:
          - "Modify `emitRoomUpdate` in [`src/waiting-room/waiting-room.gateway.ts`](src/waiting-room/waiting-room.gateway.ts:23) to use `this.server.to(room.id).emit(...)` for targeted broadcasts."
          - "Investigate sending partial/delta updates over WebSockets."
          - "Replace `console.log` in `WaitingRoomGateway` with `LoggerService`."
          - "Improve type safety for WebSocket message payloads in `WaitingRoomGateway`."

      # Section 4: Operational Readiness & DevOps
      - step_id: "SYNTH-OPS-001"
        description: "Enhance Health Check Endpoints (Operational, Logging, Reliability Audits)"
        sub_steps:
          - "Modify `/health/ready` ([`src/app.controller.ts`](src/app.controller.ts:13-16)) to verify PostgreSQL and Redis connectivity."
          - "Ensure `/health/live` checks basic application functionality."
          - "Add `HEALTHCHECK` instruction to Dockerfile."
      - step_id: "SYNTH-OPS-002"
        description: "Implement Graceful Shutdown (Operational, Reliability Audits)"
        sub_steps:
          - "Enable NestJS `enableShutdownHooks()` in [`src/main.ts`](src/main.ts:0)."
          - "Implement `OnModuleDestroy` in relevant services for resource cleanup (DB connections, logs)."
          - "Ensure in-flight requests complete before shutdown."
      - step_id: "SYNTH-OPS-003"
        description: "Optimize Dockerfile and Build Process (Operational Audit)"
        sub_steps:
          - "Pin base Node.js image to a specific patch version (e.g., `node:22.2.0-alpine`)."
          - "Change `npm install` to `npm ci` for deterministic builds."
          - "Remove unnecessary `./db` directory creation from Dockerfile."
      - step_id: "SYNTH-OPS-004"
        description: "Optimize Kubernetes Configurations (Operational, Performance, Reliability Audits)"
        sub_steps:
          - "Review and adjust K8s resource requests/limits."
          - "Increase replica counts for `api-deployment`, `postgres-statefulset`, `redis-deployment` for HA."
          - "Implement Pod Anti-Affinity rules."
          - "Implement Horizontal Pod Autoscaler (HPA) for `api-deployment` ([`k8s/api-deployment.yaml`](k8s/api-deployment.yaml:0))."
          - "Migrate `redis-deployment` ([`k8s/redis-deployment.yaml`](k8s/redis-deployment.yaml:0)) to a `StatefulSet` with PVC for data durability."
          - "Align image versions for Postgres/Redis between Docker Compose and K8s manifests."
      - step_id: "SYNTH-OPS-005"
        description: "Enhance Kubernetes Security (Operational Audit)"
        sub_steps:
          - "Define and apply `NetworkPolicy` resources."
          - "Configure appropriate Pod Security Contexts."
      - step_id: "SYNTH-OPS-006"
        description: "Improve Database Operational Aspects (Operational Audit)"
        sub_steps:
          - "Implement database connection pooling (covered in REL-002)."
          - "Add retry mechanisms for database connection failures (covered in REL-002)."
          - "Consider implementing a migration locking mechanism."
      - step_id: "SYNTH-OPS-007"
        description: "Plan for Disaster Recovery (Operational Audit)"
        sub_steps:
          - "Document database backup strategy (scheduled, PITR)."
          - "Define data retention policies."
          - "Outline DR testing procedure."
          - "Outline cloud Kubernetes rollback strategy."

      # Section 5: Code Quality & Maintainability
      - step_id: "SYNTH-CODE-001"
        description: "Refactor Complex Service Methods (Code Quality Audit)"
        sub_steps:
          - "Analyze and refactor `joinRoom`, `approveOrDeclineJoinRequest` in [`src/waiting-room/waiting-room.service.ts`](src/waiting-room/waiting-room.service.ts:0) into smaller, focused private methods (extract validation, player status updates)."
      - step_id: "SYNTH-CODE-002"
        description: "Centralize Cache Management (Code Quality Audit)"
        sub_steps:
          - "Consider creating a dedicated `CacheService` or utility for cache invalidation patterns."
          - "Replace scattered `this.cacheManager.del()` calls."
      - step_id: "SYNTH-CODE-003"
        description: "Update User Entity (Architecture Audit)"
        sub_steps:
          - "Add 'email' field to [`src/user/entities/user.entity.ts`](src/user/entities/user.entity.ts:0)."
          - "Generate TypeORM migration for 'email' column."
          - "Update relevant DTOs and services."

      # Section 6: Logging & Monitoring
      - step_id: "SYNTH-LOGMON-001"
        description: "Standardize and Enhance Logging (Logging, Code Quality, Ops Audits)"
        sub_steps:
          - "Refactor `AllExceptionsFilter` ([`src/common/filters/all-exceptions.filter.ts`](src/common/filters/all-exceptions.filter.ts:0)) to inject and use `LoggerService`."
          - "Implement request correlation IDs in logs."
          - "Ensure `LoggerService` is used consistently (replace `console.log`)."
          - "Remove redundant logger initialization in [`src/main.ts`](src/main.ts:0)."
          - "Adjust `LOG_LEVEL` in [`k8s/configmap.yaml`](k8s/configmap.yaml:0) for production (`info`)."
          - "Consider external logging transport for production (e.g., ELK, CloudWatch)."
      - step_id: "SYNTH-LOGMON-002"
        description: "Implement Metrics and Tracing (Logging, Architecture, Ops Audits)"
        sub_steps:
          - "Integrate basic Prometheus metrics (request count, latency, error rates) via `/metrics` endpoint."
          - "Integrate a distributed tracing solution (e.g., OpenTelemetry)."

      # Section 7: Documentation Overhaul (Crucial)
      - step_id: "SYNTH-DOC-001"
        description: "Comprehensive README.md Update (User Request, All Audits)"
        sub_steps:
          - "Ensure `README.md` is professional, comprehensive, and fully up-to-date."
          - "Verify and correct API Description & usage."
          - "Detail Setup instructions (local & containerized, including `.env` clarification, `JWT_SECRET` importance, CORS)."
          - "Update Deployment steps with Docker/Kubernetes (including Kind setup, secret creation, image loading)."
          - "Clarify Database migration instructions (TypeORM usage)."
          - "Document all environment variables clearly in `README.md` and `.env.example`."
          - "Document security features (password policy, JWT, rate limiting, headers)."
          - "Document logging system (levels, format, correlation IDs)."
          - "Document monitoring (metrics endpoint, health checks)."
          - "Document caching strategy (what's cached, TTLs, invalidation)."
          - "Document WebSocket API (events, payloads, authN/Z)."
          - "Document operational procedures (backup/recovery, DR plan outline, rollback strategy)."
          - "Consolidate duplicated information (e.g., JWT_SECRET advice)."
          - "Replace placeholder git clone URL."
          - "Ensure all sections required by `plan/waiting-room-manager-api.md` (Submission Checklist) are covered."
      - step_id: "SYNTH-DOC-002"
        description: "Enhance API Swagger/OpenAPI Documentation (Documentation Audit)"
        sub_steps:
          - "Add `@ApiTags`, `@ApiOperation`, `@ApiResponse` to health check endpoints in [`src/app.controller.ts`](src/app.controller.ts:0)."
          - "Review and correct HTTP status code consistency in `WaitingRoomController`."
          - "Ensure all DTOs and response models are accurately reflected."
      - step_id: "SYNTH-DOC-003"
        description: "General Documentation Cleanup and Additions (Documentation, Code Quality Audits)"
        sub_steps:
          - "Remove outdated DTOs (`DeleteRoomDto`, `StartGameDto`) if confirmed unused and update references."
          - "Align PostgreSQL and Redis versions in `k8s/postgres-statefulset.yaml`](k8s/postgres-statefulset.yaml:0), [`k8s/redis-deployment.yaml`](k8s/redis-deployment.yaml:0) and `docker-compose.yml`."
          - "Improve inline code comments for complex business logic, especially in services."
          - "Document custom exception filter ([`src/common/filters/all-exceptions.filter.ts`](src/common/filters/all-exceptions.filter.ts:0))."
          - "Create placeholder `plan/cloud-deployment-guide.md` and outline key sections."
          - "Update `waiting-room-manager-api-blueprint.mdml.yml` to reflect implemented changes."
    post_completion_steps:
      - "Run all unit, integration, and E2E tests thoroughly."
      - "Conduct a final comprehensive review of all changes and documentation."
      - "Submit a pull request for team review."
      - "Consider a final round of targeted testing or a limited staging deployment before full production rollout."
  constraints_and_assumptions:
    constraints:
      - "All changes must align with the core requirements specified in `plan/waiting-room-manager-api.md`."
      - "Must maintain compatibility with NestJS, TypeORM, and other core project libraries unless an upgrade is part of a specific task."
      - "Security best practices must be strictly adhered to."
      - "Minimize disruption to existing functionality during phased implementation."
    assumptions:
      - "The development team has the necessary expertise and resources to implement these changes."
      - "Access to necessary environments (dev, staging, prod) and tools is available."
      - "The existing CI/CD pipeline can be adapted for new testing and deployment needs."
  success_metrics_or_evaluation_criteria:
    - "All critical and high-priority issues from individual audits are addressed."
    - "Significant improvements in security posture, system reliability, performance, and operational stability are demonstrable."
    - "Code quality and maintainability are enhanced."
    - "Logging and monitoring provide comprehensive visibility into system health and behavior."
    - "Project documentation, especially `README.md`, is complete, accurate, professional, and highly useful for all stakeholders."
    - "All automated tests pass with increased coverage where applicable."
    - "The API is demonstrably closer to production-readiness as per `plan/waiting-room-manager-api.md`."
  acceptance_criteria:
    - "All core steps in this synthesized agenda are completed and verified."
    - "A final review by project stakeholders confirms that the API meets the improved standards for security, reliability, performance, and documentation."
    - "The updated `README.md` is deemed comprehensive and professional."
    - "The system successfully passes all automated tests and targeted manual validation."

