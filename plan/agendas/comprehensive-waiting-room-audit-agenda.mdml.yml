glossary_and_definitions: # Combined and de-duplicated from audits
  - term: "MDML Agenda"
    definition: "Markdown Machine Language Agenda - a structured YAML document defining tasks, goals, and execution plans."
  - term: "JWT"
    definition: "JSON Web Token, an open standard (RFC 7519) for securely transmitting information between parties as a JSON object."
  - term: "Refresh Token"
    definition: "A long-lived credential used to obtain new access tokens after the short-lived access token expires."
  - term: "Rate Limiting"
    definition: "A control that limits the number of requests a user or client can make to an API within a given timeframe."
  - term: "PII"
    definition: "Personally Identifiable Information - any data that could potentially identify a specific individual."
  - term: "CSP"
    definition: "Content-Security-Policy - an added layer of security that helps to detect and mitigate certain types of attacks, including Cross-Site Scripting (XSS) and data injection attacks."
  - term: "HSTS"
    definition: "HTTP Strict Transport Security - a web security policy mechanism that helps to protect websites against protocol downgrade attacks and cookie hijacking."
  - term: "Atomicity (Database)"
    definition: "A property of database transactions ensuring all operations within a transaction complete successfully or none do."
  - term: "Connection Pooling"
    definition: "Managing and reusing database connections to reduce overhead."
  - term: "Graceful Shutdown"
    definition: "Process of an application terminating cleanly, finishing current tasks and releasing resources."
  - term: "Health Check"
    definition: "An endpoint or mechanism used by orchestrators (like Kubernetes) to determine if an application instance is running and ready to receive traffic."
  - term: "Liveness Probe"
    definition: "A Kubernetes probe that checks if a container is still running. If it fails, Kubernetes restarts the container."
  - term: "Readiness Probe"
    definition: "A Kubernetes probe that checks if a container is ready to serve requests. If it fails, Kubernetes removes the pod from service load balancers."
  - term: "Correlation ID"
    definition: "A unique identifier added to logs and requests to trace a transaction through distributed systems."
  - term: "NetworkPolicy"
    definition: "A Kubernetes resource specifying how groups of pods communicate with each other and network endpoints."
  - term: "Pod Security Context"
    definition: "A Kubernetes feature defining privilege and access control settings for a Pod or Container."
  - term: "StatefulSet"
    definition: "A Kubernetes workload API object for managing stateful applications."
  - term: "Pod Anti-Affinity"
    definition: "A Kubernetes scheduling rule to prevent pods from being scheduled on the same node."
  - term: "HPA (Horizontal Pod Autoscaler)"
    definition: "A Kubernetes API object that automatically scales pod replicas based on metrics like CPU utilization."
  - term: "Distributed Tracing"
    definition: "A method to monitor requests as they flow through a distributed system."
  - term: "N+1 Problem"
    definition: "A database query anti-pattern causing N additional queries for each result of an initial query."
  - term: "TTL (Time To Live)"
    definition: "A mechanism limiting the lifespan of data."