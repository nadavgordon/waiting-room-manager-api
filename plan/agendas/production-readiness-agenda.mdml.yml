    - "Containerization: Dockerfile optimized; Docker Compose and Kubernetes configurations are robust, secure, and follow best practices."
    - "Tests: High coverage (>80%), reliable, automated, passing in local (Compose & Kind) and CI environments."
    - "Documentation: Clear, concise, accurate, and actionable for developers and DevOps."

glossary_and_definitions:
  - term: "Kind"
    definition: "Kubernetes IN Docker - A tool for running local Kubernetes clusters using Docker container 'nodes', ideal for testing K8s manifests locally."
  - term: "Docker Compose"
    definition: "A tool for defining and running multi-container Docker applications, primarily for local development environments."
  - term: "JWT"
    definition: "JSON Web Token - An open standard (RFC 7519) for securely transmitting information between parties as a JSON object."
  - term: "DTO"
    definition: "Data Transfer Object - An object that carries data between processes, often used for request/response payloads in APIs."
  - term: "ORM"
    definition: "Object-Relational Mapper - A programming technique for converting data between incompatible type systems using object-oriented programming languages (e.g., TypeORM)."
  - term: "CORS"
    definition: "Cross-Origin Resource Sharing - A browser security feature that restricts cross-origin HTTP requests initiated from scripts."
  - term: "PostgreSQL"
    definition: "A powerful, open-source object-relational database system."
  - term: "Redis"
    definition: "An open-source, in-memory data structure store, used as a database, cache, and message broker."
  - term: "Kubernetes (K8s)"
    definition: "An open-source system for automating deployment, scaling, and management of containerized applications."
  - term: "Migration (DB)"
    definition: "A controlled way to evolve database schema over time, keeping it synchronized with the application's codebase."
  - term: "`.env.example`"
    definition: "A template file listing all necessary environment variables for an application, with placeholders or example values, to be copied to `.env` and populated."
  - term: "StatefulSet (K8s)"
    definition: "A Kubernetes workload API object used to manage stateful applications, providing stable, unique network identifiers and persistent storage."
  - term: "ConfigMap (K8s)"
    definition: "A Kubernetes API object used to store non-confidential data in key-value pairs, consumable by pods as environment variables, command-line arguments, or configuration files in a volume."
  - term: "Secret (K8s)"
    definition: "A Kubernetes API object used to store and manage sensitive information, such as passwords, OAuth tokens, and ssh keys."
  - term: "PVC (PersistentVolumeClaim K8s)"
    definition: "A request for storage by a user in Kubernetes, which can be fulfilled by a PersistentVolume."
  - term: "Ingress (K8s)"
    definition: "A Kubernetes API object that manages external access to services in a cluster, typically HTTP. Ingress can provide load balancing, SSL termination, and name-based virtual hosting."

