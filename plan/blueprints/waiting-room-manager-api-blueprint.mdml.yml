metadata:
  version: "2.5"
  status: "draft"
  date: "2025-05-27"
  title: "MDML Blueprint: Waiting Room Manager API"
  authors:
    - name: "AI Assistant Cascade"
      email: "cascade@windsurf.ai"
  schema_url: "https://schema.mdml.dev/blueprint/v2.5.json"
  profile: "standard"
  summary: >-
    This blueprint outlines the architecture, components, processes, and plan for
    the Waiting Room Manager API. The API will allow users to create, manage, join,
    and start game waiting rooms. It is designed to be a RESTful service with options
    for PHP/Laravel or Node.js (NestJS/AdonisJS/Express+TS) stacks, using an ORM
    with SQLite, MySQL, or PostgreSQL, and prepared for Docker containerization.
  tags:
    [
      "mdml",
      "mdml blueprint",
      "api",
      "backend",
      "waiting room",
      "game development",
      "restful",
      "docker",
      "kubernetes",
      "php",
      "laravel",
      "nodejs",
      "nestjs",
      "adonisjs",
      "expressjs",
      "typescript",
    ]
  relationships:
    description: >-
      This blueprint is derived from the requirements specified in the
      `plan/waiting-room-manager-api.md` document. It serves as the architectural
      guide for the development task outlined in that document and its corresponding
      MDML Agenda.
    related_documents:
      - id: "WRM-REQ-DOC"
        type: "Requirements Specification"
        path_or_url: "plan/waiting-room-manager-api.md"
        description: "The primary document detailing the project task, features, and constraints."
      - id: "WRM-AGENDA-MDML"
        type: "MDML Agenda"
        path_or_url: "plan/waiting-room-manager-api-agenda.mdml.yml"
        description: "The MDML Agenda detailing tasks and execution plan for this project."
      - id: "WRM-IMPROVEMENT-AGENDA"
        type: "MDML Agenda"
        path_or_url: "plan/waiting-room-manager-api-improvements-agenda.mdml.yml"
        description: "Agenda detailing recommended improvements based on critical review."

introduction_and_goals:
  problem_statement: >-
    Game developers need a flexible and reliable system to manage pre-game lobbies (waiting rooms)
    where players can gather before a multiplayer game starts. This system needs to handle room
    creation with various configurations, player management, and game start functionalities.
  scope_and_boundaries: >-
    The project focuses on the backend API development, including core waiting room functionalities,
    user authentication (simulated or real), and preparation for containerized deployment.
    It does not include frontend development or complex game logic beyond room management.
  key_goals:
    - "Provide a robust and scalable RESTful API for waiting room management."
    - "Ensure secure access and operations within the API."
    - "Facilitate real-time updates for an enhanced user experience."
    - "Enable easy deployment and scaling using modern DevOps practices."
    - "Maintain high code quality through comprehensive testing and documentation."

architectural_overview:
  design_principles:
    - "**Modularity**: Components should be loosely coupled and highly cohesive."
    - "**Scalability**: Design for horizontal scaling to handle increasing load."
    - "**Security**: Implement robust authentication, authorization, and input validation."
    - "**Maintainability**: Write clean, readable, and well-documented code."
    - "**Observability**: Integrate logging, monitoring, and tracing capabilities."
  chosen_technologies:
    - "Backend Framework: NestJS (Node.js)"
    - "ORM: TypeORM"
    - "Database: PostgreSQL (recommended for production, SQLite for development/testing)"
    - "Containerization: Docker"
    - "Orchestration: Kubernetes"
    - "Real-time: WebSockets (Socket.IO)"
    - "Caching: Redis (for performance and real-time)"
  system_context:
    description: "The Waiting Room Manager API acts as a central service for game clients to interact with, managing room states and player interactions. It will expose RESTful endpoints and WebSocket channels."
    diagram: |-
      ```mermaid
      graph TD
          A[Game Client] -->|REST/WS| B(Waiting Room API)
          B -->|ORM| C(Database: PostgreSQL)
          B -->|Cache| D(Cache: Redis)
          B -->|Logs| E(Logging Service)
          B -->|Metrics| F(Monitoring Service)
          G[DevOps Tools] -->|Deploy| B
      ```

components_and_modules:
  backend_api:
    description: "The core NestJS application providing API endpoints and business logic."
    modules:
      - name: "AuthModule"
        description: "Handles user authentication (registration, login) and authorization (JWT, Guards)."
        responsibilities:
          - User registration and login.
          - JWT token generation and validation.
          - Protecting API routes.
      - name: "WaitingRoomModule"
        description: "Manages waiting room creation, joining, leaving, starting games, and player requests."
        responsibilities:
          - CRUD operations for rooms.
          - Managing player lists and pending requests.
          - Enforcing game rules and room states.
      - name: "UserModule"
        description: "Manages user profiles and data."
        responsibilities:
          - User data storage and retrieval.
          - User-related business logic.
      - name: "GatewayModule" (WebSockets)
        description: "Provides real-time communication for room updates."
        responsibilities:
          - Broadcasting room status changes.
          - Notifying players of join/leave events.
          - Handling real-time player interactions.
    entities:
      - name: "User"
        description: "Represents a user in the system, capable of hosting or joining rooms."
        attributes:
          - id (UUID)
          - username
          - password (hashed)
          - email
      - name: "Room"
        description: "Represents a game waiting room."
        attributes:
          - id (UUID)
          - name
          - hostId (UUID, foreign key to User)
          - isPublic (boolean)
          - approvalRequired (boolean)
          - maxPlayers (number)
          - playerIds (Many-to-Many relation to User)
          - pendingPlayerRequests (Many-to-Many relation to User)
          - status (enum: waiting, in-progress, finished)
          - createdAt, updatedAt

data_models_and_management:
  database_schema:
    description: "Relational database schema for users and rooms."
    tables:
      - name: "users"
        columns:
          - id (PK, UUID)
          - username (Unique)
          - password (Hashed)
          - email (Unique)
          - createdAt, updatedAt
      - name: "rooms"
        columns:
          - id (PK, UUID)
          - name
          - hostId (FK to users.id)
          - isPublic
          - approvalRequired
          - maxPlayers
          - status
          - createdAt, updatedAt
      - name: "rooms_players_users" (Join Table)
        columns:
          - roomId (FK to rooms.id)
          - userId (FK to users.id)
      - name: "rooms_pending_players_users" (Join Table)
        columns:
          - roomId (FK to rooms.id)
          - userId (FK to users.id)
  data_access_strategy: "TypeORM will be used for all database interactions, utilizing its repository pattern and migration capabilities."
  caching_strategy: "Redis will be used for caching frequently accessed data, such as public room lists, to reduce database load and improve response times."

security_considerations:
  authentication:
    description: "JWT-based authentication for securing API endpoints."
    details: "Users will obtain a JWT upon successful login, which must be included in subsequent requests to access protected resources. NestJS Guards will enforce authentication."
  authorization:
    description: "Role-based or permission-based authorization to control access to specific actions."
    details: "Only room hosts can start or delete their rooms. This will be enforced through custom NestJS Guards or decorators."
  cors_management:
    description: "Fine-grained CORS configuration to allow only specified origins."
    details: "CORS middleware will be configured to restrict access to known client origins, preventing wildcard ('*') access."
  input_validation:
    description: "Comprehensive input validation for all incoming request payloads."
    details: "Utilize NestJS ValidationPipe with class-validator and class-transformer to ensure data integrity and prevent malicious inputs (e.g., SQL injection, XSS)."
  secret_management:
    description: "Secure handling of sensitive information."
    details: "Environment variables and Kubernetes Secrets will be used for database credentials, JWT secrets, and other sensitive configurations. No secrets hardcoded in the codebase."

real_time_communication:
  technology: "WebSockets (Socket.IO integration with NestJS)."
  use_cases:
    - "Real-time updates for room status changes (e.g., from 'waiting' to 'in-progress')."
    - "Instant notifications when players join or leave a room."
    - "Real-time updates for pending join requests (approval/decline)."
    - "Potential for in-room chat functionality."
  implementation_details: "A dedicated NestJS Gateway will manage WebSocket connections and emit events to subscribed clients based on changes in room state or player activity."

deployment_and_operations:
  containerization:
    description: "Multi-stage Dockerfile for building optimized and secure application images."
    details: "The Dockerfile will include separate stages for dependencies installation, code compilation, and final image creation, ensuring a small production image. The application will run as a non-root user."
  orchestration:
    description: "Kubernetes manifests for deploying, managing, and scaling the application."
    files:
      - "deployment.yaml: Defines the application deployment, including replica sets, resource limits, and readiness/liveness probes."
      - "service.yaml: Exposes the application within the Kubernetes cluster and to external traffic."
      - "configmap.yaml: Manages non-sensitive configuration data."
      - "secret.yaml: Securely manages sensitive data like database credentials."
  logging_and_monitoring:
    description: "Integration with logging and monitoring solutions."
    details: "Structured logging (e.g., Winston, Pino) will be implemented for application logs. Metrics (e.g., Prometheus) and tracing (e.g., OpenTelemetry) will be considered for observability."
  ci_cd_pipeline:
    description: "Automated build, test, and deployment pipeline."
    details: "A CI/CD pipeline will be configured to automatically build Docker images, run tests, and deploy to Kubernetes upon code changes."

testing_strategy:
  unit_tests:
    description: "Tests for individual components (e.g., services, utility functions) in isolation."
    framework: "Jest"
    coverage: "High coverage for business logic in services."
  integration_tests:
    description: "Tests for interactions between components (e.g., controllers and services, database interactions)."
    framework: "Jest, Supertest"
    coverage: "Cover all API endpoints and critical workflows."
  e2e_tests:
    description: "End-to-end tests simulating user interactions with the deployed API."
    framework: "Jest, Supertest"
    coverage: "Cover main user journeys (e.g., create room, join, start game)."
  test_data_management: "Utilize in-memory databases (e.g., SQLite) for unit tests and dedicated test databases for integration/E2E tests with proper setup and teardown."

api_documentation:
  tooling: "Swagger/OpenAPI (using `@nestjs/swagger`)."
  details: "All API endpoints, request/response schemas, and error codes will be comprehensively documented. Examples for payloads will be provided to facilitate client integration."

project_plan_and_execution:
  development_workflow:
    - "Feature branching model (Git Flow or similar)."
    - "Code reviews for all changes."
    - "Regular stand-ups and progress tracking."
  milestones:
    - "Phase 1: Authentication and Database Refinement."
    - "Phase 2: Real-time Communication and Enhanced Error Handling."
    - "Phase 3: Comprehensive Testing and DevOps Configuration."
  risk_management:
    - "Technical Debt: Address proactively through refactoring and code reviews."
    - "Performance Bottlenecks: Monitor and optimize critical paths."
    - "Security Vulnerabilities: Conduct regular security audits and keep dependencies updated."

glossary_of_terms:
  - term: "WRM API"
    definition: "Waiting Room Manager API - the system being built."
  - term: "Room Host"
    definition: "The user who creates and typically manages a game room."
  - term: "CORS"
    definition: "Cross-Origin Resource Sharing - a browser security feature that restricts cross-origin HTTP requests."
  - term: "ORM"
    definition: "Object-Relational Mapper - a programming technique for converting data between incompatible type systems using object-oriented programming languages."
  - term: "Dockerfile"
    definition: "A text document that contains all the commands a user could call on the command line to assemble an image."
  - term: "Kubernetes (K8s)"
    definition: "An open-source system for automating deployment, scaling, and management of containerized applications."
  - term: "JWT"
    definition: "JSON Web Token, an open standard (RFC 7519) for securely transmitting information between parties as a JSON object."
  - term: "WebSocket"
    definition: "A computer communications protocol, providing full-duplex communication channels over a single TCP connection."
  - term: "Redis"
    definition: "An open source (BSD licensed), in-memory data structure store, used as a database, cache and message broker."

